devicehub.version=0.4.0
# The devicehub-network library is versioned separately from the IDE plugin.
devicehub.networkVersion=0.1.0

# Shown on JetBrains Marketplace.
devicehub.vendorName=Khubaib Khan
devicehub.vendorUrl=https://github.com/KhubaibKhan4/kmp-device-hub

# IDE the plugin compiles against when no local one is configured (CI). Set a local IDE in the
# git-ignored local.properties instead: devicehub.ideaLocalPath=/Applications/Android Studio.app
devicehub.ciPlatformVersion=2025.3

org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
kotlin.code.style=official
# Paid plan (used only with -Pdevicehub.productCode). JetBrains' rules: release-date is the major release's date
# (YYYYMMDD); release-version is an integer of at least 2 digits whose last digit is the minor version, matching
# devicehub.version (1.0.x -> 10, 1.1.x -> 11). Change both only for a new major/minor release: it resets trials.
devicehub.releaseDate=20261101
devicehub.releaseVersion=10
