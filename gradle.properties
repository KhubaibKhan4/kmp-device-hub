devicehub.version=0.1.2
# The devicehub-network library is versioned separately from the IDE plugin.
devicehub.networkVersion=0.1.0

# Shown on JetBrains Marketplace.
devicehub.vendorName=Khubaib Khan
devicehub.vendorUrl=https://github.com/KhubaibKhan4/kmp-device-hub

# IDE the plugin compiles against when no local one is configured (CI). Set a local IDE in the
# git-ignored local.properties instead: devicehub.ideaLocalPath=/Applications/Android Studio.app
devicehub.ciPlatformVersion=2025.3

org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
kotlin.code.style=official
# Paid plan (used only with -Pdevicehub.productCode): date and version this major release went out.
devicehub.releaseDate=20261101
devicehub.releaseVersion=1
